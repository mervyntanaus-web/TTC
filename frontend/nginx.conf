server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Backend API, reverse-proxied so the SPA can always call same-origin
    # "/api/..." regardless of how the stack is deployed.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # Range requests (video seeking) need these passed through untouched.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # SPA fallback: any non-API, non-file route serves index.html so
    # React Router's client-side routes work on a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
