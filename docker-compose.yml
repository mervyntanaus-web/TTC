services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ttc
      POSTGRES_DB: ttc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ttc-admin
      MINIO_ROOT_PASSWORD: ttc-admin-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      TTC_DATABASE_URL: postgresql+psycopg2://ttc:ttc@postgres:5432/ttc
      TTC_S3_ENDPOINT_URL: http://minio:9000
      TTC_S3_ACCESS_KEY: ttc-admin
      TTC_S3_SECRET_KEY: ttc-admin-secret
      TTC_JWT_SECRET: change-me-in-a-real-deployment
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

  # One-off seeding job: `docker compose run --rm seed`. Not part of the
  # normal `up` so it never re-runs implicitly against real data.
  seed:
    build: ./backend
    environment:
      TTC_DATABASE_URL: postgresql+psycopg2://ttc:ttc@postgres:5432/ttc
      TTC_S3_ENDPOINT_URL: http://minio:9000
      TTC_S3_ACCESS_KEY: ttc-admin
      TTC_S3_SECRET_KEY: ttc-admin-secret
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./seed:/app/seed
    entrypoint: ["python", "-m", "seed.seed_data"]
    profiles: ["tools"]

volumes:
  postgres_data:
  minio_data:
